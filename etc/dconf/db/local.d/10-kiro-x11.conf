# Kiro X11 (kiro-dot-files) — system-wide GTK appearance defaults via dconf.
# libadwaita apps follow only color-scheme, so without prefer-dark they stay light on a dark desktop;
# gtk-theme/icon-theme are what gsettings readers (ATT, portals) see. Users override per key in their own dconf.
# 10- sorts after kiro-wayland-dotfiles' 00-kiro.conf, so these values win where both packages are installed.
[org/gnome/desktop/interface]
color-scheme='prefer-dark'
gtk-theme='Arc-Dawn-Dark'
icon-theme='Surfn'
cursor-theme='Bibata-Modern-Ice'
cursor-size=24
